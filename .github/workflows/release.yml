name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A5E5F0: ${{ secrets.A5E5F0 }}
          BC6026: ${{ secrets.BC6026 }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('A5E5F0', '')
          meta_b = os.environ.get('BC6026', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- d2cb44feb9c0cd8c -->', meta_a)
          if meta_b:
              out = out.replace('<!-- 8d33505b31fe833fb7993de81bc4c7b56d -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
