  <style>
    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        YuGothic,
        Meiryo,
        sans-serif;
    }

    .tool-card {
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }

    .tool-card:hover {
      transform: translateY(-4px);
      box-shadow:
        0 18px 40px rgba(15, 23, 42, 0.12);
    }

    .tool-card.disabled {
      cursor: default;
    }

    .tool-card.disabled:hover {
      transform: none;
      box-shadow:
        0 1px 2px rgba(15, 23, 42, 0.05);
    }
  </style>
</head>

<body class="min-h-screen bg-slate-50 text-slate-800">

<!-- header -->
<header class="border-b bg-white">
  <div class="mx-auto max-w-7xl px-5 py-5">
    <div class="flex items-center justify-between gap-4">
      <div>

        <h1 class="text-xl font-black">
          skuro709
        </h1>

        <p class="mt-1 text-sm text-slate-500">

<!-- MAIN -->
<main class="mx-auto max-w-7xl px-5 py-10 sm:py-14">

    </div>

    <h2
      class="text-3xl font-black tracking-tight sm:text-5xl"
    >
      便利なツールを<br class="sm:hidden">
      もっとシンプルに。
    </h2>

    <p class="mx-auto mt-5 max-w-2xl leading-7 text-slate-600">
      雨を避けて移動したり、日程を調整したり。<br>
      登録不要ですぐに使える便利なWebツールを<br>
      まとめています。
    </p>
  </section>

  <!--
縦画面：1列

-->

  <section>

      id="toolGrid"

        grid

  <!-- INFORMATION -->
  <section class="mt-10 sm:mt-14">

      class="

      </p>
    </div>
  </section>
</main>

<!-- FOOTER -->
<footer
  class="
    mt-10
    border-t
    bg-white
    py-8
    text-center
    text-sm
    text-slate-400
  ">

</footer>

<script>


/* めぇもぉぉぉ…
=========================   
   新しいツールを追加するときは、
   この配列に1つ追加するだけ。

   例: ↓
   
   {
     id: "weather",
     number: "03",
     icon: "☀️",
     category: "WEATHER",
     title: "天気チェック",
     description: "全国の天気をチェックできます。",
     url: "./weather.html",
     color: "amber",
     enabled: true
   },

========================= */


const tools = [

  /* tool 01 */
  {
    id: "rain-nav",
    number: "01",
    icon: "🌧️",
    category: "WEATHER NAVIGATION",
    title: "雨を避けてお出かけ",
    description:
      "現在地と目的地を指定して、今から雨に濡れずに移動できそうかをチェックします。",
    url: "./tools/01/rain-nav.html",
    color: "sky",
    enabled: true
  },

  /* tool 02 */
  {
    id: "schedule",
    number: "02",
    icon: "📅",
    category: "SCHEDULE",
    title: "サーバーレス日程調整",
    description:
      "イベントを作ってURLを共有。参加者は○・△・×を入力するだけ。登録もデータベースも不要です。",
    url: "./tools/02/schedule.html",
    color: "violet",
    enabled: true
  },
  
  /* tool 03 */
  {
    id: "w-gacha",
    number: "03",
    icon: "🎰",
    category: "jp gacha",
    title: "名言・ことわざ・ジョーク 日本語訳ガチャ",
    description:
      "ランダムな名言やジョークを引いて、日本語で楽しむガチャゲームです。",
    url: "./tools/03/w-gacha.html",
    color: "rose",
    enabled: true
  },
  
  /* tool 04 */
  {
    id: "world-name",
    number: "04",
    icon: "🔮",
    category: "world name checker",
    title: "世界線チェッカー",
    description:
      "名前から年齢・性別・国籍を推定するエンタメ診断ツールです。",
    url: "./tools/04/world-name.html",
    color: "indigo",
    enabled: true
  },
  
  /* tool 05 */
  {
    id: "zipcode",
    number: "05",
    icon: "📮",
    category: "zipcode",
    title: "郵便番号→住所検索",
    description:
      "郵便番号から住所を簡単にすばやく自動検索・コピーできるツールです。",
    url: "./tools/05/zipcode.html",
    color: "cyan",
    enabled: true
  },

];
/* ↑( ]; )最後のツールに絶対付けろ！！ */

  /* 案の案…w
  メモ
  計算機
  タイマー
  URL作成、短縮、逆に長くするやつ
  危ないURLの確認などなど
  */

/* カラーテーマ */
const colorThemes = {

  sky: {
    icon: "bg-sky-100",
    iconText: "text-sky-700",
    category: "text-sky-600",
    button: "bg-sky-600",
    buttonHover: "hover:bg-sky-700",
    border: "border-sky-100"
  },

  violet: {
    icon: "bg-violet-100",
    iconText: "text-violet-700",
    category: "text-violet-600",
    button: "bg-violet-600",
    buttonHover: "hover:bg-violet-700",
    border: "border-violet-100"
  },

  amber: {
    icon: "bg-amber-100",
    iconText: "text-amber-700",
    category: "text-amber-600",
    button: "bg-amber-500",
    buttonHover: "hover:bg-amber-600",
    border: "border-amber-100"
  },

  emerald: {
    icon: "bg-emerald-100",
    iconText: "text-emerald-700",
    category: "text-emerald-600",
    button: "bg-emerald-600",
    buttonHover: "hover:bg-emerald-700",
    border: "border-emerald-100"
  },

  orange: {
    icon: "bg-orange-100",
    iconText: "text-orange-700",
    category: "text-orange-600",
    button: "bg-orange-600",
    buttonHover: "hover:bg-orange-700",
    border: "border-orange-100"
  },

  indigo: {
    icon: "bg-indigo-100",
    iconText: "text-indigo-700",
    category: "text-indigo-600",
    button: "bg-indigo-600",
    buttonHover: "hover:bg-indigo-700",
    border: "border-indigo-100"
  },

  rose: {
    icon: "bg-rose-100",
    iconText: "text-rose-700",
    category: "text-rose-600",
    button: "bg-rose-600",
    buttonHover: "hover:bg-rose-700",
    border: "border-rose-100"
  },

  cyan: {
    icon: "bg-cyan-100",
    iconText: "text-cyan-700",
    category: "text-cyan-600",
    button: "bg-cyan-600",
    buttonHover: "hover:bg-cyan-700",
    border: "border-cyan-100"
  }
};

/* カード生成 */
function renderTools() {

  const grid =
    document.getElementById("toolGrid");

  grid.innerHTML = "";

  tools.forEach(tool => {

    const theme =
      colorThemes[tool.color]
      || colorThemes.sky;

    const card =
      document.createElement("article");


    /* 使用可能なツール */
    if (tool.enabled) {
      card.className =
        `
        tool-card
        rounded-3xl
        border
        ${theme.border}
        bg-white
        p-6
        shadow-sm
        sm:p-7
        flex
        flex-col
        h-full
        `;

      card.innerHTML = `
      
        <!-- カード上部 -->
        <div class="flex items-start justify-between gap-4">
          <div
            class="
              flex
              h-14
              w-14
              shrink-0
              items-center
              justify-center
              rounded-2xl
              ${theme.icon}
              text-3xl
              ${theme.iconText}
            ">
            ${tool.icon}
          </div>

          <span
            class="
              text-xs
              font-black
              tracking-wider
              ${theme.category}
            ">
            TOOL ${tool.number}
          </span>
        </div>

        <!-- カテゴリー -->
        <p
          class="
            mt-6
            text-xs
            font-black
            tracking-wider
            ${theme.category}
          ">        
          ${tool.category}
        </p>

        <!-- タイトル -->
        <h3
          class="
            mt-2
            text-xl
            font-black
            sm:text-2xl
          ">
          ${tool.title}
        </h3>

        <!-- 説明 -->
        <p
          class="
            mt-4
            flex-1
            text-sm
            leading-7
            text-slate-600
          ">
          ${tool.description}
        </p>

        <!-- ボタン -->
        <a
          href="${tool.url}"
          class="
            mt-6
            inline-flex
            items-center
            justify-center
            rounded-xl
            px-5
            py-3
            font-bold
            text-white
            ${theme.button}
            ${theme.buttonHover}
          ">
          ツールを開く
          <span class="ml-2">→</span>
        </a>
      `;
    }


    /* 準備中のツール　*/
    else {
      card.className =
        `
        tool-card
        disabled
        rounded-3xl
        border
        border-slate-200
        bg-slate-100
        p-6
        opacity-70
        sm:p-7
        `;

      card.innerHTML = `

        <div
          class="
            flex
            h-14
            w-14
            items-center
            justify-center
            rounded-2xl
            bg-slate-200
            text-3xl
          ">
          ${tool.icon}
        </div>

        <p
          class="
            mt-6
            text-xs
            font-black
            tracking-wider
            text-slate-400
          ">
          TOOL ${tool.number}
        </p>

        <h3
          class="
            mt-2
            text-xl
            font-black
            text-slate-600
          ">
          ${tool.title}
        </h3>

        <p
          class="
            mt-4
            text-sm
            leading-7
            text-slate-500
          ">
          ${tool.description}
        </p>

        <div
          class="
            mt-6
            rounded-xl
            bg-slate-200
            px-5
            py-3
            text-center
            text-sm
            font-bold
            text-slate-500
          ">
          準備中
        </div>
      `;
    }
    grid.appendChild(card);
  });
}

/* 初期化 */
renderTools();

</script>
</body>
</html>
